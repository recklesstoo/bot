# Añade este bloque a ~/.hermes/config.yaml (si ya existe mcp_servers, solo añade la entrada tradingview).
# Ajusta la ruta a tu venv y al repo.
mcp_servers:
  tradingview:
    command: "/home/jdm/bot/integrations/hermes/.venv/bin/python"
    args: ["/home/jdm/bot/integrations/hermes/tv_mcp.py"]
    env:
      CDP_URL: "http://127.0.0.1:9222"
